---
layout: blogheader
title: Blog
---

{% for post in site.posts %}
<small>{{ post.date | date: "%Y-%m-%d" }}</small>
<h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
{{ post.excerpt }}
<p style="text-align: right;"><a href="{{ post.url | relative_url }}">Continue reading</a></p>
<br>
{% endfor %}
